# Builds this repository. The Innertube sources stay in the sibling checkout
# Metrolists-main so ../Metrolists-main resolves from the Gradle root.
# pull_request_target is intentionally not used.
# Do not interpolate issue or pull request titles, bodies, or comments into run steps.

name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Metrolist-Windows
          persist-credentials: false

      - name: Checkout Metrolist sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MetrolistGroup/Metrolist
          # MetrolistGroup/Metrolist main HEAD on 2026-10-25. Pinned; do not track a moving branch.
          ref: 876e355181fd3b04e7063b10442fef1b721d53b3
          path: Metrolists-main
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build
        working-directory: Metrolist-Windows
        shell: cmd
        run: call gradlew.bat build --no-daemon --console=plain
